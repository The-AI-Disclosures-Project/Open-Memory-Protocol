[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acp-memory-server"
version = "0.1.0"
description = "MCP server that unifies coding-agent transcript memory across ACP-compatible agents (Claude Code, Codex, Goose, ...)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ilan", email = "ilan@aidisclosures.org" }]
dependencies = [
    "agent-client-protocol>=0.9.0",
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
acp-memory = "acp_memory_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["acp_memory_server"]

[tool.ruff]
line-length = 110
target-version = "py311"
