[project]
name = "omp-langchain-harness"
version = "0.1.0"
description = "LangChain create_agent harness implementing the Open Memory Protocol (Packer draft v0.2) harness contract"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Open Memory Protocol Initiative", email = "ompi@aidisclosures.org" },
]
dependencies = [
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "open-memory-protocol",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
omp-agent = "omp_langchain.cli:main"

[tool.uv.sources]
open-memory-protocol = { path = "../python-loader-validator", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omp_langchain"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
