[project]
name = "cognee-draft-semantic-core"
version = "0.1.0"
description = "The six-part portable memory contract from the Cognee discussion draft v0.1 as code: object model, exchange manifests and receipts, lifecycle with tombstones, a COGX 0.1 codec with no Cognee dependency, a validator, and fixtures"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Open Memory Protocol Initiative", email = "ompi@aidisclosures.org" },
]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
adapters = ["ibm-draft-memory-records", "aidp-draft-fmp", "packer-draft-langchain-harness"]

[project.scripts]
semantic-core = "semantic_core.cli:main"

[tool.uv.sources]
ibm-draft-memory-records = { path = "../ibm-draft-memory-records", editable = true }
aidp-draft-fmp = { path = "../aidp-draft-fmp", editable = true }
packer-draft-langchain-harness = { path = "../packer-draft-langchain-harness", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semantic_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
