[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acp-memory-server"
version = "0.1.0"
description = "MCP server that unifies coding-agent transcript memory across ACP-compatible agents (Claude Code, Codex, Goose, ...)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ilan", email = "ilan@aidisclosures.org" }]
dependencies = [
    "agent-client-protocol>=0.9.0",
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "zstandard>=0.22",  # zed backend: thread payloads in threads.db may be zstd-compressed
]

[project.scripts]
acp-memory = "acp_memory_server.cli:main"

[tool.setuptools]
packages = ["acp_memory_server", "acp_memory_server.filesystem_backend"]
package-dir = { acp_memory_server = ".", "acp_memory_server.filesystem_backend" = "filesystem_backend" }

[tool.ruff]
line-length = 110
target-version = "py311"
